name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 镜像名（GHCR 要求全小写；本仓库为 HiTAndRunaway/oncall-diagnosis-agent）
env:
  IMAGE_NAME: ghcr.io/hitandrunaway/oncall-diagnosis-agent

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SuperBizAgent-release-2026-05-17/pom.xml

      - name: Build with Maven (skip tests)
        working-directory: SuperBizAgent-release-2026-05-17
        run: mvn -B -DskipTests package

      # ---- 以下步骤仅在 push 到 master 时执行：构建并推送镜像；PR 只构建不推送 ----

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: SuperBizAgent-release-2026-05-17
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
