<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperBizAgent — OnCall Diagnosis</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Code highlight -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
<script>
  if (!localStorage.getItem('sbiz_api_key')) {
    window.location.href = '/login.html';
  }
</script>
<div class="app-layout">

    <!-- Activity Bar -->
    <div class="activity-bar">
        <div class="activity-icon active" title="Explorer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </div>
        <div class="activity-icon" title="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="activity-icon" title="Memory" onclick="app.toggleMemoryPanel()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M9 3v18" stroke="currentColor" stroke-width="2"/></svg>
        </div>
    </div>

    <!-- Sidebar (Explorer) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span>EXPLORER</span>
            <span style="font-size:14px;cursor:pointer" title="New Chat" onclick="app.newChat()">+</span>
        </div>
        <div class="sidebar-content">
            <button class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>New Chat</span>
            </button>
            <div class="chat-history-section">
                <div class="history-header">RECENT CHATS</div>
                <div class="chat-history-list" id="chatHistoryList"></div>
            </div>
            <button class="memory-panel-btn" id="memoryPanelBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span>Memory</span>
            </button>
        </div>
        <div class="sidebar-footer">
            <span id="sidebarUserHint">guest</span>
            <button class="theme-switcher" onclick="app.cycleTheme()" style="color:var(--text-muted);background:none;border:none;cursor:pointer;font-size:10px;font-family:var(--font-mono)">▸ THEME</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
        <!-- Tabs -->
        <div class="tabs-bar">
            <div class="tab-item active" id="chatTab">
                <span>▸ chat.tsx</span>
                <span class="tab-close">×</span>
            </div>
        </div>

        <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span>AI Ops</span>
        </button>

        <div class="chat-container">
            <div class="welcome-greeting" id="welcomeGreeting">
                <p>$ <span style="color:var(--accent2)">superbizagent</span> <span style="color:var(--accent3)">--oncall</span></p>
                <p style="font-size:0.8em;color:var(--text-muted);margin-top:8px">Type your question to start diagnosis</p>
            </div>
            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-container">
                <div class="input-group-wrapper">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="$ ask anything..." maxlength="1000" class="message-input">
                        <div class="input-bottom-bar">
                            <div class="tools-btn-wrapper">
                                <button class="tools-btn" id="toolsBtn" title="Tools">
                                    <svg class="tools-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
                                </button>
                                <div class="tools-menu" id="toolsMenu">
                                    <div class="tools-menu-item" id="uploadFileItem">
                                        <svg viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                        <span>Upload File</span>
                                    </div>
                                </div>
                            </div>
                            <div class="right-actions">
                                <div class="mode-selector-wrapper">
                                    <button class="mode-selector-btn" id="modeSelectorBtn">
                                        <span id="currentModeText">QUICK</span>
                                        <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"/></svg>
                                    </button>
                                    <div class="mode-dropdown" id="modeDropdown">
                                        <div class="dropdown-header">Mode</div>
                                        <div class="dropdown-item active" data-mode="quick">
                                            <div class="dropdown-item-main"><span>QUICK</span><span class="badge-new">NEW</span></div>
                                            <div class="dropdown-item-sub">Standard mode</div>
                                        </div>
                                        <div class="dropdown-item" data-mode="stream">
                                            <div class="dropdown-item-main"><span>STREAM</span></div>
                                            <div class="dropdown-item-sub">SSE streaming</div>
                                        </div>
                                    </div>
                                </div>
                                <button class="send-btn-circle" id="sendButton" title="Send (Enter)">
                                    <svg viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9M22 2L2 9l9 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf" style="display:none">
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">
                <span class="status-item"><span class="status-dot"></span> Ready</span>
                <span class="status-item">main</span>
            </div>
            <div class="status-bar-right">
                <span class="status-item">Ln 1, Col 1</span>
                <span class="status-item">UTF-8</span>
                <button class="theme-switcher" onclick="app.cycleTheme()" title="Cycle Theme">T: VS Code Dark+</button>
            </div>
        </div>
    </main>
</div>

<!-- Memory Panel -->
<div id="memoryPanel" class="memory-panel" style="display:none">
    <div class="memory-panel-header">
        <h3>MEMORY</h3>
        <p>Auto-extracted from conversations</p>
        <button class="memory-close-btn" onclick="app.toggleMemoryPanel()">&times;</button>
    </div>
    <div class="memory-stats" id="memoryStats"></div>
    <div class="memory-tabs" id="memoryTabs">
        <button class="memory-tab active" data-tab="facts">FACTS</button>
        <button class="memory-tab" data-tab="profiles">PROFILES</button>
        <button class="memory-tab" data-tab="preferences">PREFERENCES</button>
    </div>
    <div class="memory-list" id="memoryList"></div>
    <div class="memory-empty" id="memoryEmpty" style="display:none">No memories yet</div>
</div>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">Analyzing...</div>
        <div class="loading-subtext">Diagnosis in progress</div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
