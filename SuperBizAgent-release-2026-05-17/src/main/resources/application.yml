server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,pdf

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

    # Spring Data Redis 配置
    data:
      redis:
        host: localhost
        port: 6379
        password:               # 留空=无密码
        timeout: 3000ms

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数
    # === 以下为新增的策略配置 ===
    strategy:
      default-strategy: heading          # heading | fixed-size | semantic | parent-child
      extension-overrides:               # 按扩展名覆盖（可选）
        txt: fixed-size
      strategies:                        # 各策略的独立参数
        fixed-size:
          max-size: 500
          overlap: 100
        semantic:
          max-size: 800
          overlap: 100
        parent-child:
          child-size: 300
          parent-size: 1200
          overlap: 50

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称
  recall-count: 30  # Milvus 初始召回数量（需大于 rerank.threshold）
  rerank:
    enabled: true  # 是否启用重排序
    threshold: 10  # 召回数超过此值才触发重排序
    top-k: 10  # 重排序后保留的文档数
    model: "gte-rerank-v2"  # DashScope Rerank 模型
  hybrid:
    enabled: true          # 双路召回开关，false=退化为单路向量
    bm25-weight: 1.0       # BM25 路 RRF 权重
    vector-weight: 1.0     # 向量路 RRF 权重
    rrf-k: 60              # RRF 平滑常数
  rewrite:
    strategy: direct           # 查询改写策略: prompt_rewrite | hypothetical_answer | detail_abstract | direct
    model: qwen-turbo          # 改写用的轻量 LLM 模型
    retry:
      max-attempts: 3          # 超时类错误最大重试次数
      backoff:
        initial-interval: 5s   # 首次重试间隔
        multiplier: 5          # 指数退避倍数（5s→25s→125s）
    cache:
      enabled: true            # Redis 缓存开关
      ttl-hours: 1             # 缓存过期时间（小时）
  # Agentic RAG 配置（仅对话路径，不影响 AIOps）
  agentic:
    enabled: false                       # 全局开关：true=Agentic RAG, false=传统 RAG
    max-search-rounds: 3                 # 最大检索轮次
    min-relevance-score: 0.6             # 最低相关性阈值（0-1）
    min-results-for-answer: 1            # 生成答案所需的最少达标结果数
    fallback-strategy: use_best          # 降级策略
    timeout-seconds: 60                  # 检索阶段总超时（秒）
    max-sub-questions: 5                 # 问题拆解最大子问题数
    evaluator-model: qwen-turbo          # 评估模型
    decomposer-model: qwen-turbo         # 拆解模型

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: false  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）

# Mem0 风格长期记忆配置
memory:
  enabled: true                          # 全局开关：false 时所有记忆功能不注册
  extraction:
    trigger-message-count: 6             # 会话新增消息对超过此数触发提取
    model: qwen-turbo                    # 提取 + 冲突判断用的轻量 LLM
    max-batch-messages: 50               # 一次提取最多分析的对话条数
  search:
    top-k: 5                             # recallMemory 默认返回数
    score-threshold: 0.6                 # 冲突检测时向量相似度最低阈值
  decay:
    enabled: true
    cron: "0 3 * * *"                    # 每天凌晨 3 点执行
    decay-factor: 0.1                    # 每次衰减的置信度减少量
    min-confidence: 0.3                  # 低于此值自动删除
    no-access-threshold-hours: 168       # 7 天无访问触发衰减
  ttl:
    fact-hours: 0                        # 0 表示永不过期
    profile-hours: 2160                  # 90 天（90 × 24）
    preference-hours: 720                # 30 天（30 × 24）
  system-prompt:
    inject-profile: true                 # 是否注入用户画像到 System Prompt
    inject-preferences: true             # 是否注入行为偏好到 System Prompt
    max-length: 500                      # 注入内容最大字符数

# 会话 Redis 存储配置
session:
  redis:
    ttl-hours: 24              # 会话过期时间（小时），0=永不过期，默认24
    fallback-to-memory: true   # Redis 故障时自动降级到内存存储
    summary:
      enabled: true            # 是否查询摘要层，false=跳过摘要直接查详情
      trigger-threshold: 10    # 消息对数超过此阈值触发摘要生成
      model: "qwen3-max"       # 生成摘要用的 LLM 模型
      max-summary-length: 500  # 摘要最大字符数

# Resilience4j 断路器配置
resilience4j:
  circuitbreaker:
    instances:
      dashscope-embedding:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# AIOps 超时保护
aiops:
  total-timeout-seconds: 300
