# Production profile: security enabled
superbiz:
  security:
    enabled: true
    cors:
      allowed-origins:
        - "https://your-domain.com"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed-headers:
        - "*"
  rate-limit:
    enabled: true
