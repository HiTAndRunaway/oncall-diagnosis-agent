# Test profile configuration
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:test-key}
    # 测试环境关闭 MCP 客户端：spring-ai 1.1.2 会在上下文初始化时同步连接 SSE 端点，
    # 测试环境无真实腾讯 MCP 服务，关闭后上下文可独立加载
    mcp:
      client:
        enabled: false

# 自定义 DashScope 配置（VectorEmbeddingService 读取，init 时校验非空且非占位符）
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:test-key}

# 测试环境启用 Agent Skills（classpath 来源，验证 SkillsConfig 装配 + hooks 注入不破坏上下文）
skills:
  enabled: true
  registry: classpath
  classpath-path: skills

prometheus:
  mock-enabled: true

cls:
  mock-enabled: true

superbiz:
  security:
    enabled: false

aiops:
  total-timeout-seconds: 300
  eval:
    enabled: true
    min-pass-score: 12
    sample-rate: 1.0

intent:
  router:
    enabled: true
    confidence-threshold: 0.85
